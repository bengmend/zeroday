name: Docker Build and Mend Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_REPO_NAME: ${{ github.repository }}
  DOCKER_TAG: ${{ github.sha }}

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: |
        echo "Installing dependencies for Mend CLI scan..."
        npm install --only=prod

    - name: Mend CLI Scan
      env:
        MEND_EMAIL: ${{secrets.MEND_EMAIL}}
        MEND_USER_KEY: ${{secrets.MEND_USER_KEY}}
        MEND_URL: https://saas-eu.mend.io
      run: |
        echo Downloading Mend CLI
        curl https://downloads.mend.io/cli/linux_amd64/mend -o ./mend && chmod +x ./mend
        echo Run Mend dependencies scan
        ./mend dep -u -r
        echo Run Mend code scan
        ./mend code -s
        echo Run Mend image scan
        ./mend image ${{ env.DOCKER_REPO_NAME }}:${{ env.DOCKER_TAG }} --format sarif --filename results.sarif --local-pull
        echo Run Mend container scan
        ./mend container

    - name: Upload Mend scan results
      uses: actions/upload-artifact@v4
      with:
        name: mend-scan-results
        path: |
          results.sarif
          mend-results.json

    - name: Mend scan completed
      run: |
        echo "✅ Mend CLI security scanning completed successfully"
        echo "📊 Scan results uploaded as artifacts"
        echo "🔍 Check Mend dashboard for detailed vulnerability reports"


