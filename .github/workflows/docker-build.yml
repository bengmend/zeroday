name: Docker Build and Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Run Snyk to check for vulnerabilities
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high --file=package.json

    - name: Run npm audit
      run: |
        echo "Running npm audit to check for known vulnerabilities..."
        npm audit --audit-level=moderate --json > npm-audit-results.json || true
        echo "npm audit completed"

    - name: Upload npm audit results
      uses: actions/upload-artifact@v4
      with:
        name: npm-audit-results
        path: npm-audit-results.json

    - name: Run security tests
      run: |
        echo "Running security test suite..."
        docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} node test.js
        echo "Security tests completed successfully"

    - name: Comment PR with security scan results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v8
      with:
        script: |
          const fs = require('fs');
          let comment = '## 🔍 Security Scan Results\n\n';
          
          // Add Trivy results if available
          if (fs.existsSync('trivy-results.sarif')) {
            comment += '### ✅ Trivy Vulnerability Scan\n';
            comment += 'Container vulnerability scan completed. Check the Security tab for detailed results.\n\n';
          }
          
          // Add npm audit results
          if (fs.existsSync('npm-audit-results.json')) {
            const auditResults = JSON.parse(fs.readFileSync('npm-audit-results.json', 'utf8'));
            comment += '### 📦 npm Audit Results\n';
            comment += `- **Vulnerabilities found**: ${auditResults.metadata.vulnerabilities.total}\n`;
            comment += `- **High severity**: ${auditResults.metadata.vulnerabilities.high}\n`;
            comment += `- **Moderate severity**: ${auditResults.metadata.vulnerabilities.moderate}\n`;
            comment += `- **Low severity**: ${auditResults.metadata.vulnerabilities.low}\n\n`;
          }
          
          comment += '### ⚠️ Expected Results\n';
          comment += 'This project intentionally contains malicious npm libraries for security testing.\n';
          comment += 'High vulnerability counts are expected and indicate successful detection.\n\n';
          comment += '**This is a security testing project - do not use in production!**';
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

  security-report:
    runs-on: ubuntu-latest
    needs: build-and-scan
    if: always()
    
    steps:
    - name: Generate security report
      run: |
        echo "# Security Test Report" > security-report.md
        echo "" >> security-report.md
        echo "## Project Information" >> security-report.md
        echo "- Repository: ${{ github.repository }}" >> security-report.md
        echo "- Branch: ${{ github.ref_name }}" >> security-report.md
        echo "- Commit: ${{ github.sha }}" >> security-report.md
        echo "- Build Date: $(date)" >> security-report.md
        echo "" >> security-report.md
        echo "## Malicious Libraries Detected" >> security-report.md
        echo "This project contains 27 known malicious npm libraries for security testing." >> security-report.md
        echo "" >> security-report.md
        echo "## Scan Results" >> security-report.md
        echo "- Docker build: ${{ needs.build-and-scan.result }}" >> security-report.md
        echo "- Security scans completed successfully" >> security-report.md
        echo "" >> security-report.md
        echo "## Recommendations" >> security-report.md
        echo "1. This project should trigger security alerts in SCA tools" >> security-report.md
        echo "2. All malicious libraries should be detected by security scanners" >> security-report.md
        echo "3. Do not use this project in production environments" >> security-report.md

    - name: Upload security report
      uses: actions/upload-artifact@v4
      with:
        name: security-report
        path: security-report.md
