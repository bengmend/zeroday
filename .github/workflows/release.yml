name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        default: '1.0.0'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm install --no-audit --no-fund

    - name: Run tests
      run: |
        echo "Running security tests before release..."
        node test.js

    - name: Build Docker image
      run: |
        echo "Building Docker image for release..."
        docker build -t vulnerable-test-app:${{ github.ref_name }} .

    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        release_name: Release ${{ github.ref_name }}
        body: |
          ## 🚨 Security Testing Release ${{ github.ref_name }}
          
          **⚠️ WARNING: This release contains malicious npm libraries for security testing purposes only!**
          
          ### What's Included
          - 27+ known malicious npm packages
          - Docker containerization for safe testing
          - Comprehensive security test suite
          - GitHub Actions workflows for automated testing
          
          ### Security Features
          - Containerized execution
          - Non-root user execution
          - Resource limits
          - Network isolation
          
          ### Usage
          ```bash
          # Clone and run
          git clone <repository-url>
          cd vulnerable-test-project
          docker-compose up --build
          ```
          
          **Remember: This is for security testing only - do not use in production!**
        draft: false
        prerelease: false

    - name: Upload Docker image to GitHub Container Registry
      run: |
        echo "Pushing Docker image to GitHub Container Registry..."
        echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
        docker tag vulnerable-test-app:${{ github.ref_name }} ghcr.io/${{ github.repository }}:${{ github.ref_name }}
        docker tag vulnerable-test-app:${{ github.ref_name }} ghcr.io/${{ github.repository }}:latest
        docker push ghcr.io/${{ github.repository }}:${{ github.ref_name }}
        docker push ghcr.io/${{ github.repository }}:latest

    - name: Generate security report
      run: |
        echo "# Security Test Release Report - ${{ github.ref_name }}" > release-security-report.md
        echo "" >> release-security-report.md
        echo "## Release Information" >> release-security-report.md
        echo "- Version: ${{ github.ref_name }}" >> release-security-report.md
        echo "- Release Date: $(date)" >> release-security-report.md
        echo "- Repository: ${{ github.repository }}" >> release-security-report.md
        echo "" >> release-security-report.md
        echo "## Malicious Libraries Included" >> release-security-report.md
        echo "This release contains 27+ known malicious npm libraries:" >> release-security-report.md
        echo "- backslash, chalk-template, supports-hyperlinks" >> release-security-report.md
        echo "- has-ansi, simple-swizzle, color-string" >> release-security-report.md
        echo "- error-ex, color-name, is-arrayish" >> release-security-report.md
        echo "- slice-ansi, color-convert, wrap-ansi" >> release-security-report.md
        echo "- ansi-regex, supports-color, strip-ansi" >> release-security-report.md
        echo "- chalk, debug, ansi-styles" >> release-security-report.md
        echo "- proto-tinker-wc, Prebid-universal-creative" >> release-security-report.md
        echo "- duckdb, @duckdb/node-api, @duckdb/node-bindings" >> release-security-report.md
        echo "- @duckdb/duckdb-wasm, prebid.js, Prebid" >> release-security-report.md
        echo "- @coveops/abi" >> release-security-report.md
        echo "" >> release-security-report.md
        echo "## Security Testing Results" >> release-security-report.md
        echo "- All malicious libraries load successfully" >> release-security-report.md
        echo "- Security test suite passes" >> release-security-report.md
        echo "- Docker container builds and runs correctly" >> release-security-report.md
        echo "- GitHub Actions workflows execute successfully" >> release-security-report.md
        echo "" >> release-security-report.md
        echo "## Usage Instructions" >> release-security-report.md
        echo "1. Use only in isolated, controlled environments" >> release-security-report.md
        echo "2. Run in Docker containers for safety" >> release-security-report.md
        echo "3. Monitor for security scanner detection" >> release-security-report.md
        echo "4. Do not use in production environments" >> release-security-report.md

    - name: Upload security report
      uses: actions/upload-artifact@v4
      with:
        name: release-security-report-${{ github.ref_name }}
        path: release-security-report.md
