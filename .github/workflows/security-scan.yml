name: Security Scan

on:
  schedule:
    # Run security scans daily at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    branches: [ main, develop ]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: |
        echo "Installing dependencies for security scanning..."
        npm install --no-audit --no-fund

    - name: Run npm audit
      run: |
        echo "Running npm audit..."
        npm audit --audit-level=moderate --json > npm-audit-results.json || true
        echo "npm audit completed"

    - name: Run Snyk scan
      if: ${{ secrets.SNYK_TOKEN }}
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high --file=package.json --json-file-output=snyk-results.json

    - name: Run OWASP Dependency Check
      run: |
        echo "Running OWASP Dependency Check..."
        npx @cyclonedx/cyclonedx-npm --output-file bom.json || true
        echo "OWASP Dependency Check completed"

    - name: Scan with Trivy
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-fs-results.sarif'

    - name: Upload Trivy FS scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-fs-results.sarif'

    - name: Generate security scan report
      run: |
        echo "# Security Scan Report - $(date)" > security-scan-report.md
        echo "" >> security-scan-report.md
        echo "## Scan Information" >> security-scan-report.md
        echo "- Scan Date: $(date)" >> security-scan-report.md
        echo "- Repository: ${{ github.repository }}" >> security-scan-report.md
        echo "- Branch: ${{ github.ref_name }}" >> security-scan-report.md
        echo "- Commit: ${{ github.sha }}" >> security-scan-report.md
        echo "" >> security-scan-report.md
        echo "## Scan Results" >> security-scan-report.md
        
        # Add npm audit results
        if [ -f "npm-audit-results.json" ]; then
          echo "### npm Audit Results" >> security-scan-report.md
          echo "```json" >> security-scan-report.md
          cat npm-audit-results.json >> security-scan-report.md
          echo "```" >> security-scan-report.md
          echo "" >> security-scan-report.md
        fi
        
        # Add Snyk results
        if [ -f "snyk-results.json" ]; then
          echo "### Snyk Results" >> security-scan-report.md
          echo "```json" >> security-scan-report.md
          cat snyk-results.json >> security-scan-report.md
          echo "```" >> security-scan-report.md
          echo "" >> security-scan-report.md
        fi
        
        # Add OWASP results
        if [ -f "bom.json" ]; then
          echo "### OWASP Dependency Check Results" >> security-scan-report.md
          echo "Bill of Materials generated successfully" >> security-scan-report.md
          echo "" >> security-scan-report.md
        fi
        
        echo "### Expected Results" >> security-scan-report.md
        echo "This project intentionally contains malicious npm libraries." >> security-scan-report.md
        echo "High vulnerability counts are expected and indicate successful detection." >> security-scan-report.md
        echo "" >> security-scan-report.md
        echo "### Recommendations" >> security-scan-report.md
        echo "1. All malicious libraries should be detected by security scanners" >> security-scan-report.md
        echo "2. High severity vulnerabilities are expected" >> security-scan-report.md
        echo "3. Use this project only for security testing purposes" >> security-scan-report.md
        echo "4. Do not use in production environments" >> security-scan-report.md

    - name: Upload security scan report
      uses: actions/upload-artifact@v4
      with:
        name: security-scan-report-$(date +%Y%m%d)
        path: |
          security-scan-report.md
          npm-audit-results.json
          snyk-results.json
          bom.json
          trivy-fs-results.sarif

    - name: Comment on PR with scan results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v8
      with:
        script: |
          const fs = require('fs');
          let comment = '## 🔍 Security Scan Results\n\n';
          
          // Add npm audit results
          if (fs.existsSync('npm-audit-results.json')) {
            const auditResults = JSON.parse(fs.readFileSync('npm-audit-results.json', 'utf8'));
            comment += '### 📦 npm Audit\n';
            comment += `- **Total vulnerabilities**: ${auditResults.metadata.vulnerabilities.total}\n`;
            comment += `- **High severity**: ${auditResults.metadata.vulnerabilities.high}\n`;
            comment += `- **Moderate severity**: ${auditResults.metadata.vulnerabilities.moderate}\n`;
            comment += `- **Low severity**: ${auditResults.metadata.vulnerabilities.low}\n\n`;
          }
          
          // Add Snyk results
          if (fs.existsSync('snyk-results.json')) {
            const snykResults = JSON.parse(fs.readFileSync('snyk-results.json', 'utf8'));
            comment += '### 🔒 Snyk Scan\n';
            comment += `- **Issues found**: ${snykResults.summary.totalIssues}\n`;
            comment += `- **High severity**: ${snykResults.summary.issuesBySeverity.high}\n`;
            comment += `- **Medium severity**: ${snykResults.summary.issuesBySeverity.medium}\n\n`;
          }
          
          comment += '### ⚠️ Expected Results\n';
          comment += 'This project intentionally contains malicious npm libraries for security testing.\n';
          comment += 'High vulnerability counts indicate successful detection by security scanners.\n\n';
          comment += '**This is a security testing project - do not use in production!**';
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });
