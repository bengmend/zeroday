# Dependabot configuration for security testing project
version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "security-team"
    assignees:
      - "security-team"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "security"
    # Ignore malicious packages - we want to keep them for testing
    ignore:
      - dependency-name: "backslash"
      - dependency-name: "chalk-template"
      - dependency-name: "supports-hyperlinks"
      - dependency-name: "has-ansi"
      - dependency-name: "simple-swizzle"
      - dependency-name: "color-string"
      - dependency-name: "error-ex"
      - dependency-name: "color-name"
      - dependency-name: "is-arrayish"
      - dependency-name: "slice-ansi"
      - dependency-name: "color-convert"
      - dependency-name: "wrap-ansi"
      - dependency-name: "ansi-regex"
      - dependency-name: "supports-color"
      - dependency-name: "strip-ansi"
      - dependency-name: "chalk"
      - dependency-name: "debug"
      - dependency-name: "ansi-styles"
      - dependency-name: "proto-tinker-wc"
      - dependency-name: "Prebid-universal-creative"
      - dependency-name: "duckdb"
      - dependency-name: "@duckdb/node-api"
      - dependency-name: "@duckdb/node-bindings"
      - dependency-name: "@duckdb/duckdb-wasm"
      - dependency-name: "prebid.js"
      - dependency-name: "Prebid"
      - dependency-name: "@coveops/abi"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "security-team"
    assignees:
      - "security-team"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "github-actions"
      - "dependencies"
